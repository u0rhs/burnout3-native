# A code mod (the mod kit's SDK, docs/modding/DESIGN.md §2): draws a box with the VBlank counter over the game.
# Build it with the SDK's templates (sdk/README.md); the libraries land in bin/ under the names below.
[mod]
id = hello-overlay
name = Hello overlay
version = 1.0
author = the port's mod kit
description = Draws a small box with the game's VBlank counter in the top left corner (a code-mod example).
api = 2

[code]
windows = bin/windows/hello_overlay.dll
linux = bin/linux/hello_overlay.so
macos = bin/macos/hello_overlay.dylib
gameplay = no
