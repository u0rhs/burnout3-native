# A script mod (the mod kit's Lua scripting, docs/modding/DESIGN.md §10): draws the player's speed and the race timer.
# No build step: the script is the mod. docs/modding/tutorials/06-a-lua-script.md explains each line.
[mod]
id = lua-speedo
name = Lua speedometer
version = 1.0
author = the port's mod kit
description = Draws the player's speed and the race timer in a box over the race (a script-mod example).
api = 3

[script]
main = scripts/main.lua
gameplay = no
